worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    
    # Cloudflare Real IP configuration
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Explicitly set log locations so GoAccess can read them
    access_log /var/log/nginx/access_real.log combined;
    error_log /var/log/nginx/error_real.log warn;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Security Headers (Anti-Clickjacking & XSS)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Redirect HTTP to HTTPS (Port 80)
    server {
        listen 80;
        server_name vodatrip.id www.vodatrip.id api.vodatrip.id;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # 2. Backend CMS (Directus HTTPS - Port 443)
    server {
        listen 443 ssl;
        server_name api.vodatrip.id;

        ssl_certificate /etc/letsencrypt/live/vodatrip.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vodatrip.id/privkey.pem;

        location / {
            proxy_pass http://directus:8055;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # GoAccess Dashboard (Static HTML, auto-updates every 10s via docker-compose loop)
        location /stats/ {
            alias /var/log/nginx/;
            index report.html;
            # Uncomment baris di bawah ini jika nanti ingin ditambah password:
            # auth_basic "Restricted Access";
            # auth_basic_user_file /etc/nginx/.htpasswd;
        }
    }

    # 3. Astro Frontend (HTTPS - Port 443)
    server {
        listen 443 ssl;
        server_name vodatrip.id www.vodatrip.id;

        ssl_certificate /etc/letsencrypt/live/vodatrip.id/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/vodatrip.id/privkey.pem;

        location / {
            proxy_pass http://web:4321;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
